<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1 id="bigWord">TODO List</h1>
    <input id="textEntrance" type="text" placeholder="Enter new item...">
    <input id="listEntrance" type="submit" value="Submit Item" onclick="getItems()">
    
    <div id="mainContainer">
        <div class="columnWrapper">
            <h3 id="activeHeader">Active</h3>
            <div id="containerActive"></div>
        </div>

        <div class="columnWrapper">
            <h3 id="completedHeader">Completed</h3>
            <div id="containerCompleted"></div>
        </div>
    </div>
</body>
</html>
